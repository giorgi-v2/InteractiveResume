<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giorgi's resume</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/83d3021956.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="sidebar">
      <div class="avatar">
        <img src="./assets/avatar.jpg" alt="Avatar" class="avatar__image" />
        <div class="avatar__description">
          <h1 class="avatar__description-name">Giorgi Davitashvili</h1>
          <span class="avatar__description-details">Frontend Developer</span>
          <span class="avatar__description-details"
            >22 Years Old, Georgia, Tbilisi</span
          >
        </div>
      </div>
      <div class="sidebar__navigation">
        <nav class="navigation">
          <a href="#home" class="navigation__link navigation__link--active"
            ><i class="fa-solid fa-house navigaion__link-icon"></i
            ><span>Home</span></a
          >
          <a href="#skills" class="navigation__link"
            ><i class="fa-solid fa-wrench navigaion__link-icon"></i
            ><span>Skills</span></a
          >
          <a href="#education" class="navigation__link"
            ><i class="fa-solid fa-building-columns navigaion__link-icon"></i
            ><span>Education</span></a
          >
          <a href="#projects" class="navigation__link"
            ><i class="fa-solid fa-suitcase navigaion__link-icon"></i
            ><span>Projects</span></a
          >
          <a href="#contacts" class="navigation__link"
            ><i class="fa-solid fa-phone navigaion__link-icon"></i
            ><span>Contacts</span></a
          >
        </nav>
      </div>
      <div class="contacts">
        <div class="contacts__item">
          <i class="fa-brands fa-telegram contacts__item-icon"></i>
        </div>
        <div class="contacts__item">
          <i class="fa-brands fa-square-linkedin contacts__item-icon"></i>
        </div>
        <div class="contacts__item">
          <i class="fa-brands fa-github contacts__item-icon"></i>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="content__home">
        <div class="content__home-greeting">
          <div class="content__home-greeting-visual-container">
            <div class="content__home-greeting-visual"></div>
          </div>
          <div class="content__home-greeting-lines">
            <div class="content__home-greeting-line">
              <div class="content__home-greeting-line-number">01</div>
              <div class="content__home-greeting-line-tag">&lt;</div>
              <div class="content__home-greeting-line-tag">
                Hello, I'm
                <span class="content__home-greeting-line-highlight"
                  >Giorgi</span
                >
              </div>
              <div class="content__home-greeting-line-tag">/&gt;</div>
            </div>
            <div class="content__home-greeting-line">
              <div class="content__home-greeting-line-number">02</div>
              <div class="content__home-greeting-line-tag">&lt;</div>
              <div class="content__home-greeting-line-tag">
                I'm
                <span class="content__home-greeting-line-highlight"
                  >Front-end</span
                >
                developer
              </div>
              <div class="content__home-greeting-line-tag">/&gt;</div>
            </div>
            <div class="content__home-greeting-line">
              <div class="content__home-greeting-line-number">03</div>
              <div class="content__home-greeting-line-tag">&lt;</div>
              <div class="content__home-greeting-line-tag">
                With focus on <i class="fa-brands fa-react"></i>
                <span class="content__home-greeting-line-highlight">React</span>
              </div>
              <div class="content__home-greeting-line-tag">/&gt;</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
